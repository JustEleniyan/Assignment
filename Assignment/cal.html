<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
* {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    /* background-color: darkslategray; */
}

.body {
    background-color: white;
    font-family: Arial, Helvetica, sans-serif;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.box {
    width: 600px;
    height: 200px;
    background-color: blue;
    margin: 30px auto;
    padding: 25px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
}

.num {
    display: flex;

    gap: 12px;
    margin-bottom: 15px;
    justify-content: space-between;
}

.num input {
    width: 100%;
    height: 55px;
    color: #fff;
    background-color: blue;
    border: none;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    font-size: 18px;
    cursor: pointer;
    border-radius: 12px;
    transition: 0.2 ease;
}

.symbols {
    display: flex;
    justify-content: space-between;
    margin: 20px 0 0 0;

}


.symbols button {
    width: 30px;
    background-color: rgb(40, 56, 56, 56);
    box-shadow: 0 8px 24px lightgray;
    border-radius: 5px;
    align-items: center;
    color: #fff;
}

#output {
    width: 500px;
    height: 30px;
    margin: 20px 0 0 0;
    background-color: rgb(30, 26, 65);
    box-shadow: 0 8px 24px lightgray;
    border-radius: 12px;
    color: #fff;
    align-items: center;


}
    </style>
</head>

<body>
    <div class="box">
        <div class="num">
            <input type="text" placeholder="0" id="inputField1">

            <div><span id="show">?</span></div>
            <input type="text" placeholder="0" id="inputField2">
        </div>
        <div class="symbols">
            <button onclick="divide()">/</button>
            <button onclick="add()">+</button>
            <button onclick="subtract()">-</button>
            <button onclick="multiply()">*</button>
            <button onclick="pow()">**</button>
        </div>
        <div id="output"></div>
    </div>
</body>

</html>
<script>
    function divide() {
        let input1 = Number(document.getElementById('inputField1').value)
        let input2 = Number(document.getElementById('inputField2').value)
        let operator = document.getElementById('show')
        let result = input1 / input2

        let outputField = document.getElementById('output')

        outputField.innerHTML = result
        operator.innerHTML = '/'
    }

    function add() {
        let input1 = Number(document.getElementById('inputField1').value)
        let input2 = Number(document.getElementById('inputField2').value)
        let operator = document.getElementById('show')

        let result = input1 + input2

        let outputField = document.getElementById('output')

        outputField.innerHTML = result
        operator.innerHTML = '+'

    }

    function subtract() {
        let input1 = Number(document.getElementById('inputField1').value)
        let input2 = Number(document.getElementById('inputField2').value)
        let operator = document.getElementById('show')

        let result = input1 - input2

        let outputField = document.getElementById('output')

        outputField.innerHTML = result
        operator.innerHTML = '-'

    }

    function multiply() {
        let input1 = Number(document.getElementById('inputField1').value)
        let input2 = Number(document.getElementById('inputField2').value)
        let operator = document.getElementById('show')

        let result = input1 * input2

        let outputField = document.getElementById('output')

        outputField.innerHTML = result
        operator.innerHTML = '*'

    }

    function pow() {
        let input1 = Number(document.getElementById('inputField1').value)
        let input2 = Number(document.getElementById('inputField2').value)
        let operator = document.getElementById('show')

        let result = input1 ** input2

        let outputField = document.getElementById('output')

        outputField.innerHTML = result
        operator.innerHTML = '**'

    }
</script>
