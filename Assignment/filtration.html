<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #171329;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 16px;
        }

        .body {
            background-color: #252044;
            width: 100%;
            max-width: 640px;
            padding: 30px;
            border: 1px solid #514477;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #c4a7ff;
        }

        h2 {
            font-size: 16px;
            margin: 20px 0 10px;
            color: #e0d8ff;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 90px;
            padding: 12px;
            background-color: #171329;
            color: white;
            border: 1px solid #62558a;
            border-radius: 7px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #a78bfa;
        }

        #banned {
            min-height: 65px;
        }

        button {
            background-color: #8257e5;
            color: white;
            border: none;
            padding: 12px 25px;
            margin-top: 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #6d43cc;
        }

        .output {
            margin-top: 20px;
        }

    </style>
</head>

<body>
    <div class="body">
        <h1>Word Filter</h1>

        <h2>Words to be removed like Mad Crazy Stupid Horny</h2>
        <textarea id="banned">Mad, Crazy, Stupid, Horny</textarea>
        <h2>Input your sentence</h2>

        <div class="input">
            <textarea id="input" placeholder="Type here"></textarea>
            <button onclick="filterText()" id="filter">Filter</button>

        </div>

        <div class="output">
            <h2>Filtered result</h2>
            <textarea id="output" readonly></textarea>
        </div>

    </div>

</body>

</html>
<script>

    let input = document.getElementById('input')
    let banned = document.getElementById('banned')
    let output = document.getElementById('output')


    function maskWord(word) {
        if (word.length < 2) return "*";
        let i = word.length - 2;
        return word.slice(0, i) + "*" + word.slice(i + 1);
    }

    function filterText() {
        let words = banned.value
            .split(",")
            .map(function (w) { return w.trim(); })
            .filter(function (w) { return w.length > 0; });

        let result = input.value;


        if (words.length > 0) {
            let pattern = "\\b(" + words.join("|") + ")\\b";
            result = result.replace(new RegExp(pattern, "gi"), function (match) {
                return maskWord(match);
            });
        }

        output.value = result;

    }


</script>
